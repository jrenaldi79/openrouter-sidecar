<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src __SIDECAR_ORIGIN__; base-uri 'none'; form-action 'none'">
  <meta name="sidecar-origin" content="__SIDECAR_ORIGIN__">
  <title>OpenRouter Sidecar image uploader</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #202124; --muted: #666; --line: #ccc; --card: #f7f7f8; --accent: #4e2a84; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #202124; --fg: #eee; --muted: #bbb; --line: #555; --card: #292a2d; --accent: #b6acd1; --bad: #f2b8b5; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #202124; --fg: #eee; --muted: #bbb; --line: #555; --card: #292a2d; --accent: #b6acd1; --bad: #f2b8b5; }
    :root[data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; font: 14px/1.45 system-ui, sans-serif; background: var(--color-background-primary, var(--bg)); color: var(--color-text-primary, var(--fg)); }
    .app-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .app-heading h1 { font-size: 16px; margin: 0; }
    .app-heading .app-logo { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 4px; }
    #drop { display: block; border: 2px dashed var(--color-border-primary, var(--line)); border-radius: 10px; padding: 22px 12px; text-align: center; cursor: pointer; background: var(--color-background-secondary, var(--card)); }
    #drop.over, #drop:focus-within { border-color: var(--accent); }
    #drop strong { display: block; margin-bottom: 4px; }
    #drop span { color: var(--color-text-secondary, var(--muted)); font-size: 13px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--color-border-primary, var(--line)); }
    .name { font-weight: 600; overflow-wrap: anywhere; }
    .state { color: var(--color-text-secondary, var(--muted)); overflow-wrap: anywhere; }
    .state.error { color: var(--bad); }
    .state.done { color: var(--color-text-primary, var(--fg)); }
    code { font: 12px ui-monospace, monospace; }
    button { font: inherit; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--color-border-primary, var(--line)); background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="app-heading"><!-- APP_LOGO --><h1 id="title">Upload images</h1></div>
    <label id="drop" for="files">
      <strong>Drop images here, or choose files</strong>
      <span>PNG, JPEG or WebP, up to 20 MB each. Kept privately for 30 days.</span>
      <input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple>
    </label>
    <ul id="uploads" aria-label="Uploads" aria-live="polite"></ul>
  </main>
  <!-- BUNDLED_SCRIPT -->
</body>
</html>
