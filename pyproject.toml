[project]
name = "openrouter-image-mcp"
dynamic = ["version"]
description = "Local stdio MCP server for OpenRouter image generation"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "keyring>=25.7.0",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
openrouter-image-mcp = "openrouter_image_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openrouter_image_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_image_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: hits real OpenRouter, needs signed-in key",
    "pg: needs TEST_DATABASE_URL (disposable Postgres)",
]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["reference"]
